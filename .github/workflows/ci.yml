# ============================================================
# courseManage —— 提交前静态校验
#
# 与 docker-build.yml 分工：
#   ci.yml          → 快速反馈（语法、依赖、构建、单测、配置校验）
#   docker-build.yml → 镜像构建与发布
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      compose: ${{ steps.filter.outputs.compose }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
             || [ -z "${BASE_SHA}" ] \
             || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            all=true
            changed=""
          else
            changed="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" || true)"
          fi

          emit() {
            local key="$1" pattern="$2"
            if [ "${all}" = "true" ] || echo "${changed}" | grep -qE "${pattern}"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit backend   '^backend/'
          emit frontend  '^frontend/'
          emit mcp       '^mcp-server/'
          emit compose   '^docker-compose|^\.env\.example$'
          emit workflows '^\.github/'

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        working-directory: backend
        run: python -m compileall -q .

      - name: Check dependency consistency
        working-directory: backend
        continue-on-error: true
        run: pip check

      - name: Lint with ruff (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --select=E9,F63,F7,F82 --output-format=github .

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::package-lock.json 与 package.json 不同步，回退到 npm install"
            npm install --no-audit --no-fund
          }

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Report bundle size
        working-directory: frontend
        run: |
          echo "### 前端产物体积" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          du -ah dist/assets | sort -rh | head -n 15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  mcp:
    name: MCP server tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-server/requirements*.txt

      - name: Install
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        working-directory: mcp-server
        run: ruff check .

      - name: Pytest
        working-directory: mcp-server
        run: pytest -q

      - name: Verify tool registry
        working-directory: mcp-server
        env:
          COURSEMANAGE_API_BASE: http://localhost:8000
          COURSEMANAGE_USERNAME: ci
          COURSEMANAGE_PASSWORD: ci
        run: python -m coursemanage_mcp --list-tools

  compose:
    name: Compose config validation
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          set -euo pipefail
          cp .env.example .env
          for f in docker-compose.yml docker-compose.deploy.yml; do
            echo "::group::${f}"
            docker compose -f "${f}" config >/dev/null
            echo "OK: ${f}"
            echo "::endgroup::"
          done

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp, compose, workflows]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "${results}"
          if echo "${results}" | grep -q '"result": *"failure"'; then
            echo "::error::存在失败的检查任务"
            exit 1
          fi
          echo "所有检查通过或已跳过"
